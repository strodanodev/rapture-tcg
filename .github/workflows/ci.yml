name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Balance and fun targets
        run: pnpm run sim
      - name: LitNode compatibility
        run: pnpm run title
      - name: The site builds with the live collection
        run: pnpm run build
